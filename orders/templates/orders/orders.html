{% extends "base.html" %}

{% block title %}Mes commandes{% endblock %}

{% block content %}
<h1 class="h3 mb-4">Mes commandes</h1>

{% for order in orders %}
    {% include "orders/_order_item.html" with order=order role="buyer" %}
{% empty %}
    <p class="text-muted">Aucune commande effectuée.</p>
{% endfor %}
{% endblock %}
