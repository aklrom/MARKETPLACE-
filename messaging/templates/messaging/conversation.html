
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vos discussion</title>
</head>
<body>
    {% for message in messages_exchanged %}
        {% if request.user == message.sender %}
            <p><strong>{{request.user}}</strong>:{{message.content}}</p>
        {% else %}
            <p><strong>{{message.receiver}}</strong>:{{message.content}}</p>  
    {% endfor %}          
    <form method="POST">
        <textarea name="content" rows="40" cols="100"></textarea>
        <button type="submit">Envoyer</button>
    </form>
</body>
</html>
