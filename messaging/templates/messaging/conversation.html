
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>joie</title>
</head>
<body>
    {% for message in message_all %}
        <p><strong>{{message.sender}}</strong>{{message.content}} ---------{{message.sent_at}}</p> 
    {% empty %}
        <p>Aucun message</p>    
    {% endfor %}          
    <form method="POST">
        {% csrf_token %}
        <textarea name="message" rows="5" cols="70"></textarea>
        <button type="submit">Envoyer</button>
    </form>
</body>
</html>
