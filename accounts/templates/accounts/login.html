{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1b2a5c">
    <title>Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'accounts/site.css' %}">
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-8 col-md-5 col-lg-4">

                <div class="text-center mb-4">
                    <a class="brand brand--on-light" href="{% url 'product_list' %}">
                        <span class="brand__tag" aria-hidden="true"></span>Marketplace
                    </a>
                </div>

                <div class="card shadow border-0 p-4">

                    <h1 class="text-center h3 mb-4">Se connecter</h1>

                    <form method="post">
                        {% csrf_token %}

                        {% if form.non_field_errors %}
                            <div class="alert alert-danger py-2" role="alert">
                                {{ form.non_field_errors }}
                            </div>
                        {% endif %}

                        <div class="mb-3">
                            <label class="form-label" for="id_username">Numéro WhatsApp</label>
                            <input type="tel" name="username" id="id_username"
                                   class="form-control" placeholder="+22997000000"
                                   value="{{ form.username.value|default:'' }}" required autofocus>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="id_password">Mot de passe</label>
                            <input type="password" name="password" id="id_password"
                                   class="form-control" required>
                        </div>

                        <button class="btn btn-primary w-100" type="submit">Se connecter</button>
                    </form>

                    <p class="text-center small mt-3 mb-0">
                        Pas encore de compte ?
                        <a href="{% url 'register' %}">Créer un compte</a>
                    </p>

                </div>

            </div>
        </div>
    </div>
    <script src="{% static 'accounts/site.js' %}" defer></script>
</body>
</html>
